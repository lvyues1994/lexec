name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presets:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - gcc-asan
          - gcc-tsan
          - gcc-noexcept
          - clang-debug
          - clang-release
          - clang-asan
          - clang-tsan
          - clang-noexcept
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --workflow --preset ${{ matrix.preset }}

  compiler-floor:
    name: ${{ matrix.cxx }} (minimum supported)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++-10, package: g++-10, preset: gcc-debug }
          - { cxx: clang++-12, package: clang-12, preset: clang-debug }
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.package }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  newer-standards:
    name: ${{ matrix.preset }} (C++${{ matrix.standard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, clang-debug]
        standard: [20, 23]
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }} -DLEXEC_CXX_STANDARD=${{ matrix.standard }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
